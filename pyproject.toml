[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "presentation-reading-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor for Python projects"
requires-python = ">=3.9"
license = "MIT"
readme = "README.md"

[project.scripts]
presentation-reading-claim-audit = "presentation_reading_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["presentation_reading_claim_audit*", "tests"]
